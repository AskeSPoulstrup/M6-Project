        .log li { padding: 6px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .btn { margin: 8px 8px 0 0; padding: 10px 20px; cursor: pointer; font-size: 0.9rem; }
        .btn-primary { background: #3b4f45; color: #fff; border: none; border-radius: 6px; }
        .btn-danger { background: #8b3030; color: #fff; border: none; border-radius: 6px; }
        #status { margin-top: 16px; font-weight: 600; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Slice-Management — Firestore Seed</h1>
    <p>Åbn denne fil i en browser for at fylde Firestore med produkter og opskrifter.</p>

    <button class="btn btn-primary" onclick="seedAll()">▶ Seed produkter + opskrifter</button>
    <button class="btn btn-primary" onclick="seedProducts()">Seed kun produkter</button>
    <button class="btn btn-primary" onclick="seedRecipes()">Seed kun opskrifter</button>

    <p id="status"></p>
    <ul class="log" id="log"></ul>

        const db = firebase.firestore();

        const logEl = document.getElementById("log");

        // ===== PRODUKTER =====

          { "name": "San Marzano tomater", "slug": "san-marzano-tomater", "shortDescription": "DOP San Marzano tomater fra Campania", "description": "Autentiske San Marzano DOP hele flåede tomater. Den eneste rigtige tomat til napolitansk pizzasauce.", "price": 29.95, "category": "råvarer", "subcategory": "tomatsauce", "imageUrl": "/assets/images/san-marzano.jpg", "inStock": true, "stockQuantity": 42, "unit": "400 g", "brand": "Mutti", "featured": true },

          { "name": "Tørgær", "slug": "toergaer", "shortDescription": "Tørgær til pizzadej", "description": "Tørgær af høj kvalitet til pizzadej. Giver en stabil og forudsigelig hævning. Velegnet til kolde hævning.", "price": 14.95, "category": "råvarer", "subcategory": "gær", "imageUrl": "/assets/images/toergaer.jpg", "inStock": true, "stockQuantity": 60, "unit": "125 g", "brand": "Malteserkors" },

        // ===== OPSKRIFTER =====
        const recipes = [
          {

            "instructions": ["Opløs gæren i lunkent vand og lad det stå 5 minutter.","Bland mel og salt i en skål. Tilsæt vandgær-blandingen lidt ad gangen og ælt til en glat dej — ca. 10 minutter.","Form dejen til en kugle, læg den i en oliebestrøget skål og dæk med folie. Hæv i køleskab i minimum 24 timer (op til 72 timer for optimal smag).","Tag dejen ud 2 timer før bagning og del den i 4 portioner á ca. 200 g. Form til boller og lad hæve dækket ved stuetemperatur.","Forvarm ovn til maksimal temperatur (250–300°C) med pizzasten i minimum 45 minutter.","Knus San Marzano tomaterne i hånden og krydr med salt og en smule olivenolie.","Stræk en dejbolle forsigtigt ud til ca. 30 cm på en meldækket overflade. Brug fingerspidserne, ikke kagerullen.","Fordel tomatsauce i tynde lag ud til kanten. Placer mozzarella i stykker.","Skyd pizza ind i ovnen og bag 6–8 minutter til bunden er leopardet og osten bobler.","Tag ud, top med friske basilikumblade og dryp med god olivenolie. Servér straks."]
          },
          {
            "title": "Quattro Formaggi", "slug": "quattro-formaggi",
            "description": "Fire oste i perfekt harmoni — Fior di Latte, Gorgonzola, Parmigiano og Pecorino. Righoldig og intens.",
            "prepTimeMinutes": 20, "bakeTimeMinutes": 90, "servings": 4,
            "ingredients": ["500 g Caputo Pizzeria 00 mel","325 ml vand","10 g salt","3 g tørgær","200 g Fior di Latte mozzarella","100 g Gorgonzola dolce","50 g revet Parmigiano Reggiano","50 g revet Pecorino Romano","Extra virgin olivenolie","Friskkværnet sort peber"],
            "instructions": ["Forbered pizzadej som beskrevet i Margherita-opskriften og hæv i køleskab 24–48 timer.","Tag dejen ud 2 timer inden bagning og del i 4 portioner. Form til boller.","Forvarm ovn til maksimal temperatur med pizzasten i 45 minutter.","Stræk dejbolle ud til ca. 28 cm.","Pensl dejen med en smule olivenolie. Ingen tomatsauce på denne pizza.","Fordel Fior di Latte og Gorgonzola i stykker over dejen.","Drys Parmigiano og Pecorino over.","Bag 6–8 minutter til bunden er gylden og osten er smeltet og let brunet.","Kværn sort peber over og servér med det samme."]
          },
          {
            "title": "Diavola", "slug": "diavola",
            "description": "Den skarpe pizza med krydret 'nduja-salami og chili. For dem der kan lide det varmt.",
            "prepTimeMinutes": 20, "bakeTimeMinutes": 90, "servings": 4,
            "ingredients": ["500 g Caputo Pizzeria 00 mel","325 ml vand","10 g salt","3 g tørgær","400 g San Marzano tomater","250 g Fior di Latte mozzarella","150 g 'Nduja (krydret spredepølse)","1 rød chili, i tynde skiver","Extra virgin olivenolie","Frisk oregano"],
            "instructions": ["Forbered pizzadej og hæv i køleskab 24–72 timer.","Tag dejen ud 2 timer inden bagning. Forvarm ovn med pizzasten i 45 minutter.","Knus San Marzano tomaterne og krydr med salt.","Stræk dejbolle ud til ca. 30 cm.","Fordel tomatsauce jævnt. Placer mozzarella i stykker.","Placer klatter af 'Nduja over pizzaen.","Tilsæt chili-skiver efter smag.","Bag 6–8 minutter til bunden er mørk og sprød og 'Nduja er smeltet.","Top med frisk oregano og olivenolie ved servering."]
          },
          {
            "title": "Capricciosa", "slug": "capricciosa",
            "description": "Den fyldige klassiker med kogt skinke, champignon og artiskokker. Altid et hit.",
            "prepTimeMinutes": 25, "bakeTimeMinutes": 90, "servings": 4,
            "ingredients": ["500 g Caputo Pizzeria 00 mel","325 ml vand","10 g salt","3 g tørgær","400 g San Marzano tomater","250 g Fior di Latte mozzarella","150 g kogt skinke, i strimler","200 g champignon, i skiver","1 dåse artiskokhjerter, afdryppet","Oliven efter smag","Extra virgin olivenolie","Frisk basilikum"],
            "instructions": ["Forbered pizzadej og hæv i køleskab 24–48 timer.","Steg champignonerne hurtigt i en tør pande ved høj varme for at fjerne fugt.","Tag dejen ud 2 timer inden bagning. Forvarm ovn med pizzasten i 45 minutter.","Knus San Marzano tomaterne og krydr med salt.","Stræk dejbolle ud til ca. 30 cm.","Fordel tomatsauce og mozzarella.","Fordel skinke, champignon, artiskokhjerter og oliven.","Dryp med olivenolie og bag 7–9 minutter.","Top med frisk basilikum ved servering."]
          },
          {
            "title": "Marinara", "slug": "marinara",

            "ingredients": ["500 g Caputo Pizzeria 00 mel","325 ml vand","10 g salt","3 g tørgær","400 g San Marzano tomater","4 fed hvidløg, i tynde skiver","2 tsk tørret oregano","Extra virgin olivenolie","Flagesalt"],
            "instructions": ["Forbered pizzadej og hæv i køleskab 24–72 timer.","Tag dejen ud 2 timer inden bagning. Forvarm ovn med pizzasten i 45 minutter.","Knus San Marzano tomaterne groft med hænderne og krydr med salt.","Stræk dejbolle ud til ca. 30 cm.","Fordel tomatsauce generøst over dejen.","Placer hvidløgsskiver jævnt fordelt over tomaterne.","Drys tørret oregano over og dryp med god olivenolie.","Bag 5–7 minutter til kanten er puffet og bunden er sprød.","Drys lidt flagesalt over og servér straks."]
          },
          {
            "title": "Salsiccia e Friarielli", "slug": "salsiccia-e-friarielli",
            "description": "Napolitansk specialitet med krydret pølse og stegt broccoli rabe. Stærk smag og dejlig tekstur.",
            "prepTimeMinutes": 30, "bakeTimeMinutes": 90, "servings": 4,
            "ingredients": ["500 g Caputo Pizzeria 00 mel","325 ml vand","10 g salt","3 g tørgær","250 g Fior di Latte mozzarella","300 g frisk italiensk pølse (salsiccia)","300 g broccoli rabe (cime di rapa)","3 fed hvidløg","Chili flager","Extra virgin olivenolie"],
            "instructions": ["Forbered pizzadej og hæv i køleskab 24–48 timer.","Blancher broccoli rabe i kogende saltvand i 2 minutter, dræn og steg i olivenolie med hvidløg og chili flager til al fugt er fordampet.","Tag skindet af salsiccia og knus i stykker.","Tag dejen ud 2 timer inden bagning. Forvarm ovn med pizzasten i 45 minutter.","Stræk dejbolle ud til ca. 28 cm.","Fordel mozzarella over dejen. Ingen tomatsauce på denne pizza.","Fordel broccoli rabe og klatter af salsiccia over.","Dryp med olivenolie og bag 7–9 minutter til pølsen er brunet.","Servér med friske chili flager og ekstra olivenolie."]
          }
        ];

        // ===== HJÆLPEFUNKTIONER =====
        async function seedProducts() {
            logEl.innerHTML = '';
            statusEl.textContent = 'Seeder produkter…';
            for (const product of products) {
                try {
                    await db.collection("products").add({ ...product, createdAt: new Date() });
                    log(`✅ Produkt tilføjet: ${product.name}`);
                } catch (err) {
                    log(`❌ Fejl med ${product.name}: ${err.message}`);
                }
            }
            statusEl.textContent = '✅ Produkter seedet!';
        }

        async function seedRecipes() {
            logEl.innerHTML = '';
            statusEl.textContent = 'Seeder opskrifter…';
            for (const recipe of recipes) {
                try {
                    await db.collection("recipes").add({ ...recipe, createdAt: new Date() });
                    log(`✅ Opskrift tilføjet: ${recipe.title}`);
                } catch (err) {
                    log(`❌ Fejl med ${recipe.title}: ${err.message}`);
                }
            }
            statusEl.textContent = '✅ Opskrifter seedet!';
        }

        async function seedAll() {
            logEl.innerHTML = '';
            await seedProducts();
            await seedRecipes();
            statusEl.textContent = '✅ Alt seedet! Produkter og opskrifter er nu i Firestore.';
        }
    </script>
</body>
</html>
